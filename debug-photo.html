<!DOCTYPE html>
<html>
<head>
    <title>Debug Photo API</title>
</head>
<body>
    <h1>Debug Photo API</h1>
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://localhost:5000';
        
        async function debugPhotoAPI() {
            const results = document.getElementById('results');
            
            try {
                // 1. Login
                console.log('🔐 Logging in...');
                const loginResponse = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        usuario: 'admin.norte',
                        contrasenia: 'admin123'
                    })
                });
                
                const loginData = await loginResponse.json();
                console.log('Login response:', loginData);
                
                if (loginData.status !== 'success') {
                    throw new Error('Login failed');
                }
                
                const token = loginData.data.token;
                results.innerHTML += '<p>✅ Login successful</p>';
                
                // 2. Get Photo Info
                console.log('📸 Getting photo info...');
                const photoResponse = await fetch(`${API_BASE}/api/perfil/foto`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                const photoData = await photoResponse.json();
                console.log('Photo response:', photoData);
                
                results.innerHTML += `<p>📊 Photo API Status: ${photoResponse.status}</p>`;
                results.innerHTML += `<p>📋 Photo Data: ${JSON.stringify(photoData, null, 2)}</p>`;
                
                if (photoData.status === 'success' && photoData.data.foto_perfil) {
                    // 3. Generate Photo URL
                    const photoPath = photoData.data.foto_perfil;
                    const normalizedPath = photoPath.replace(/\\\\/g, '/');
                    const photoUrl = `${API_BASE}/api/fotos-perfil/archivo/${normalizedPath}`;
                    
                    console.log('🖼️ Photo URL:', photoUrl);
                    results.innerHTML += `<p>🔗 Photo URL: <a href="${photoUrl}" target="_blank">${photoUrl}</a></p>`;
                    
                    // 4. Test Image Display
                    const img = new Image();
                    img.onload = function() {
                        console.log('✅ Image loaded successfully');
                        results.innerHTML += '<p>✅ Image loaded successfully</p>';
                        results.innerHTML += `<img src="${photoUrl}" style="max-width: 200px; border: 2px solid green;" />`;
                    };
                    img.onerror = function() {
                        console.log('❌ Image failed to load');
                        results.innerHTML += '<p>❌ Image failed to load</p>';
                    };
                    
                    // Add authorization header for image
                    fetch(photoUrl, {
                        headers: {'Authorization': `Bearer ${token}`}
                    }).then(response => {
                        console.log('Image fetch status:', response.status);
                        if (response.status === 200) {
                            img.src = photoUrl;
                        } else {
                            results.innerHTML += `<p>❌ Image fetch failed with status: ${response.status}</p>`;
                        }
                    });
                    
                } else {
                    results.innerHTML += '<p>ℹ️ No photo found for user</p>';
                }
                
            } catch (error) {
                console.error('Error:', error);
                results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        // Run debug on page load
        debugPhotoAPI();
    </script>
</body>
</html>
