<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDF2F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#7B4397" stroke-width="3"/>
  
  <!-- Texto "TG" más grande y bold -->
  <text x="32" y="30" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#7B4397" text-anchor="middle">TG</text>
  
  <!-- Arcoíris más prominente -->
  <g transform="translate(32, 38)">
    <path d="M -18 3 A 18 18 0 0 1 18 3" stroke="#E53E3E" stroke-width="3" fill="none"/>
    <path d="M -15 3 A 15 15 0 0 1 15 3" stroke="#FF8C00" stroke-width="3" fill="none"/>
    <path d="M -12 3 A 12 12 0 0 1 12 3" stroke="#FFD700" stroke-width="3" fill="none"/>
    <path d="M -9 3 A 9 9 0 0 1 9 3" stroke="#32CD32" stroke-width="3" fill="none"/>
    <path d="M -6 3 A 6 6 0 0 1 6 3" stroke="#1E90FF" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Sol más visible -->
  <circle cx="32" cy="12" r="2.5" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <circle cx="23" cy="16" r="1.5" fill="#FFD700"/>
  <circle cx="41" cy="16" r="1.5" fill="#FFD700"/>
  <circle cx="18" cy="25" r="1" fill="#FFD700"/>
  <circle cx="46" cy="25" r="1" fill="#FFD700"/>
</svg>