<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fondo opcional transparente -->
  
  <!-- Texto "Tía" -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="#7B4397">Tía</text>
  
  <!-- Arcoíris -->
  <g transform="translate(220, 45)">
    <!-- Sol rayitos -->
    <ellipse cx="45" cy="15" rx="8" ry="3" fill="#FFD700" transform="rotate(-20 45 15)"/>
    <ellipse cx="75" cy="20" rx="8" ry="3" fill="#FFD700" transform="rotate(20 75 20)"/>
    <ellipse cx="95" cy="40" rx="8" ry="3" fill="#FFD700" transform="rotate(45 95 40)"/>
    <ellipse cx="20" cy="40" rx="8" ry="3" fill="#FFD700" transform="rotate(-45 20 40)"/>
    <ellipse cx="60" cy="5" rx="4" ry="8" fill="#FFD700"/>
    
    <!-- Arcoíris - arcos concéntricos -->
    <path d="M 10 50 A 50 50 0 0 1 110 50" stroke="#E53E3E" stroke-width="8" fill="none"/>
    <path d="M 15 50 A 42.5 42.5 0 0 1 105 50" stroke="#FF8C00" stroke-width="8" fill="none"/>
    <path d="M 20 50 A 35 35 0 0 1 100 50" stroke="#FFD700" stroke-width="8" fill="none"/>
    <path d="M 25 50 A 27.5 27.5 0 0 1 95 50" stroke="#32CD32" stroke-width="8" fill="none"/>
    <path d="M 30 50 A 20 20 0 0 1 90 50" stroke="#1E90FF" stroke-width="8" fill="none"/>
    <path d="M 35 50 A 12.5 12.5 0 0 1 85 50" stroke="#9370DB" stroke-width="8" fill="none"/>
  </g>
  
  <!-- Texto "Glenda" -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="#7B4397">Glenda</text>
  
  <!-- Subtítulo "Centro de Acompañamiento" -->
  <text x="50" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#38A169">Centro de Acompañamiento</text>
  
  <!-- Subtítulo "Pedagógico y Terapéutico" -->
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#38A169">Pedagógico y Terapéutico</text>
</svg>